<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>얼굴 특징 설계소: 내가 만드는 AI의 눈</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  얼굴 특징 설계소 (Face Feature Maker)
  정보 교과: 인공지능 — 특징 설계(feature engineering), 정규화, 강건성(일반화), 사람이 만든 특징 vs 신경망이 찾은 특징
  AI융합교육대학원 박사과정 김한나

  MediaPipe Face Landmarker가 주는 얼굴 점 좌표 중에서 학생이 직접 점 2개를 골라 '거리'로 특징을 만든다.
  그 특징으로 놀람/무표정을 학습시키고, 가까이·멀리·고개 돌리기 시험으로 특징이 튼튼한지 확인한다.
  영상·사진은 저장하지 않고, 점 좌표 숫자만 이 컴퓨터 메모리에서 사용한다.
-->
<style>
  html, body { margin: 0; height: 100%; background: #eef1f6; overflow: hidden;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

  .box input, .box select { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px;

  #tools button, #tools a { padding: 7px 12px; border-radius: 9px; border: 1px solid #cfd4de; background: rgba(255,255,255,.92);
    color: #333; font-size: 13px; cursor: pointer; font-family: inherit; text-decoration: none; }

<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>

<div id="start">
  <div class="box">

<script type="module">
import { sendToSheet, setupLeaderboard } from "../common/sheet.js?v=3";
const GAME_ID = "maker";

// =====================================================================
// 설정
// =====================================================================
const MP_VER = "0.10.14";
const MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const W = 1280, H = 720;

// 학생이 고를 수 있는 얼굴 점 (MediaPipe 478개 중 24개). 좌우는 '내 몸 기준'
const KP = [
  { i: 10, n: "이마 위" }, { i: 152, n: "턱 끝" }, { i: 234, n: "오른쪽 볼 끝" }, { i: 454, n: "왼쪽 볼 끝" },
  { i: 107, n: "오른 눈썹 안쪽" }, { i: 105, n: "오른 눈썹 가운데" }, { i: 336, n: "왼 눈썹 안쪽" }, { i: 334, n: "왼 눈썹 가운데" },
  { i: 33, n: "오른 눈 바깥" }, { i: 133, n: "오른 눈 안쪽" }, { i: 159, n: "오른 윗눈꺼풀" }, { i: 145, n: "오른 아랫눈꺼풀" },
  { i: 263, n: "왼 눈 바깥" }, { i: 362, n: "왼 눈 안쪽" }, { i: 386, n: "왼 윗눈꺼풀" }, { i: 374, n: "왼 아랫눈꺼풀" },
  { i: 168, n: "미간" }, { i: 1, n: "코끝" },
  { i: 61, n: "오른 입꼬리" }, { i: 291, n: "왼 입꼬리" }, { i: 0, n: "윗입술 위" }, { i: 13, n: "윗입술 안쪽" },
  { i: 14, n: "아랫입술 안쪽" }, { i: 17, n: "아랫입술 아래" },
];
const KPN = Object.fromEntries(KP.map(k => [k.i, k.n]));
// '자'(기준 길이): 특징 거리를 이것으로 나누면 얼굴 크기의 영향이 사라진다
const RULERS = [
  { key: "none", name: "안 나눔", a: null, b: null },
  { key: "eyes", name: "눈 사이", a: 33, b: 263 },
  { key: "nose", name: "콧대", a: 168, b: 1 },
  { key: "face", name: "얼굴 높이", a: 10, b: 152 },
];
const A_NAME = "놀람", B_NAME = "무표정";
const SAMPLES = 10, CAPTURE_TIME = 2.0, COUNTDOWN = 3, TEST_TIME = 2.0, TEST_FRAMES = 10, PASS = 0.8;
const TESTS = [
  { name: "가까이 다가가서 무표정", y: -1, how: "카메라에 얼굴을 한 뼘 더 가까이 대고, 무표정!", demo: { dist: 1.0, yaw: 0.5 } },
  { name: "멀리 떨어져서 놀람", y: 1, how: "의자를 뒤로 빼서 멀어진 채로, 놀란 표정!", demo: { dist: 0.0, yaw: 0.5 } },
  { name: "고개 돌리고 무표정", y: -1, how: "고개를 옆으로 크게 돌린 채로, 무표정!", demo: { dist: 0.43, yaw: 1.0 } },
  { name: "고개 돌리고 놀람", y: 1, how: "고개를 반대쪽으로 돌린 채로, 놀란 표정!", demo: { dist: 0.43, yaw: 0.0 } },
];
const RANKS = [[0, "견습 설계자"], [200, "특징 설계자"], [350, "비전 엔지니어"], [450, "AI 아키텍트"]];
const C = { WHITE: "#ffffff", TEXT: "#26262e", GRAY: "#6b6b78", CYAN: "#0b8fcf", GREEN: "#1fa35a", GOLD: "#d99a00",
  ORANGE: "#e8790c", A: "#e63c3c", B: "#326ec8", RED: "#e23b3b", PURPLE: "#7a4fd6", F2: "#e8790c", RULER: "#1fa35a" };
const FCOL = [C.PURPLE, C.F2];
const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif';
const STEPS = ["① 설계", "② 데이터", "③ 학습", "④ 흔들기 시험", "⑤ 비교"];

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// =====================================================================
// 그리기 도우미
// =====================================================================
function rrPath(x1, y1, x2, y2, r) {
  r = Math.max(0, Math.min(r, (x2 - x1) / 2, (y2 - y1) / 2));
  ctx.beginPath(); ctx.moveTo(x1 + r, y1); ctx.arcTo(x2, y1, x2, y2, r); ctx.arcTo(x2, y2, x1, y2, r);
  ctx.arcTo(x1, y2, x1, y1, r); ctx.arcTo(x1, y1, x2, y1, r); ctx.closePath();
}
function panel(x1, y1, x2, y2, { fill = "rgba(255,255,255,0.9)", r = 16, stroke = "rgba(0,0,0,0.12)", lw = 1 } = {}) {
  rrPath(x1, y1, x2, y2, r); ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function text(s, x, y, { size = 22, color = C.TEXT, bold = false, align = "center", base = "middle" } = {}) {
  ctx.font = `${bold ? 700 : 400} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function seg(a, b, color, lw, dash) {
  ctx.save(); if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.stroke(); ctx.restore();
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = v => `${Math.round(v * 100)}%`;

const buttons = [];
function button(id, label, x1, y1, x2, y2, color = C.PURPLE, enabled = true, active = false, size = 18) {
  const hover = mouse.pos && mouse.pos[0] >= x1 && mouse.pos[0] <= x2 && mouse.pos[1] >= y1 && mouse.pos[1] <= y2;
  panel(x1, y1, x2, y2, { fill: !enabled ? "#e4e6ec" : active ? color : hover ? color : "#ffffff", r: 12,
    stroke: enabled ? color : "#cfd4de", lw: 2 });
  text(label, (x1 + x2) / 2, (y1 + y2) / 2 + 1, { size, bold: true,
    color: !enabled ? "#9a9aa6" : (active || hover) ? "#fff" : color });
  if (enabled) buttons.push({ id, x1, y1, x2, y2 });
}

// =====================================================================
// 특징 계산: 점 2개 사이 거리 (÷ 자)
// frame = { P: {점번호: [X, Y]}, bs: [jawOpen, browInnerUp] }  (X, Y는 화면 높이 단위)
// =====================================================================
const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
function featVal(frame, fd, ruler) {
  if (!frame || !fd) return null;
  let d = dist(frame.P[fd.a], frame.P[fd.b]);
  const r = RULERS[ruler];
  if (r.a !== null) d /= Math.max(1e-6, dist(frame.P[r.a], frame.P[r.b]));
  return d;
}
const designVec = (frame, design) => [featVal(frame, design.f[0], design.ruler), featVal(frame, design.f[1], design.ruler)];
const googleVec = frame => [frame.bs[0], frame.bs[1]];

// 0~1로 맞추기 (학습 데이터의 최솟값~최댓값 기준) — 그래프와 학습을 쉽게 하려고
function makeScaler(V) {
  const lo = [0, 1].map(d => Math.min(...V.map(v => v[d]))), hi = [0, 1].map(d => Math.max(...V.map(v => v[d])));
  return v => v.map((x, d) => (x - lo[d]) / Math.max(1e-6, hi[d] - lo[d]));
}

// =====================================================================
// 학습: 로지스틱 회귀 (경사하강법)
// =====================================================================
class Logistic {
  constructor(X, Y) { this.X = X; this.y = Y.map(v => (v > 0 ? 1 : 0)); this.w = [0, 0, 0]; this.iter = 0; this.lr = 3; }
  step(n = 1) {
    for (let k = 0; k < n; k++) {
      const g = [0, 0, 0];
      this.X.forEach((x, i) => {
        const e = this.prob(x[0], x[1]) - this.y[i];
        g[0] += e * x[0]; g[1] += e * x[1]; g[2] += e;
      });
      const m = this.X.length || 1;
      this.w = this.w.map((v, d) => v - this.lr * g[d] / m);
      this.iter++;
    }
  }
  prob(x, y) { return 1 / (1 + Math.exp(-(this.w[0] * x + this.w[1] * y + this.w[2]))); }
  acc(X = this.X, Y = this.y) { return X.length ? X.filter((x, i) => (this.prob(x[0], x[1]) >= 0.5 ? 1 : 0) === Y[i]).length / X.length : 0; }
}

// 설계(특징 2개 + 자) → 학습 → 시험 채점까지 한 번에
function evaluate(samples, tests, vecFn) {
  const raw = samples.map(s => vecFn(s.frame)), scale = makeScaler(raw);
  const X = raw.map(scale), Y = samples.map(s => s.y);
  const m = new Logistic(X, Y); m.step(800);
  const testRes = tests.map((t, k) => {
    if (!t || !t.frames.length) return null;
    const TX = t.frames.map(fr => scale(vecFn(fr)));
    const ok = TX.map(v => (m.prob(v[0], v[1]) >= 0.5 ? 1 : -1) === TESTS[k].y);
    return { rate: ok.filter(Boolean).length / ok.length, pts: TX.map((v, i) => ({ v, ok: ok[i] })) };
  });
  return { model: m, scale, X, Y, acc: m.acc(), tests: testRes, pass: testRes.filter(r => r && r.rate >= PASS).length };
}

// =====================================================================
// 데모 얼굴: 3차원 얼굴 틀 + 표정 + 거리(크기) + 고개 돌리기 → 점 좌표
// =====================================================================
const TEMPLATE = {   // [x(내 오른쪽이 -), y(아래 +), z(앞 +)] 얼굴 단위
  10: [0, -1.0, 0.15], 152: [0, 1.05, 0.1], 234: [-0.8, 0.05, -0.3], 454: [0.8, 0.05, -0.3],
  107: [-0.12, -0.45, 0.1], 105: [-0.3, -0.48, 0.08], 336: [0.12, -0.45, 0.1], 334: [0.3, -0.48, 0.08],
  33: [-0.42, -0.28, 0], 133: [-0.14, -0.27, 0.02], 159: [-0.28, -0.33, 0.05], 145: [-0.28, -0.23, 0.05],
  263: [0.42, -0.28, 0], 362: [0.14, -0.27, 0.02], 386: [0.28, -0.33, 0.05], 374: [0.28, -0.23, 0.05],
  168: [0, -0.3, 0.12], 1: [0, 0.08, 0.35],
  61: [-0.22, 0.42, 0.12], 291: [0.22, 0.42, 0.12], 0: [0, 0.33, 0.2], 13: [0, 0.4, 0.2], 14: [0, 0.42, 0.2], 17: [0, 0.52, 0.18],
};
const DEMO_SL = [
  { key: "jaw", name: "입 벌림" }, { key: "brow", name: "눈썹 올림" }, { key: "smile", name: "미소" },
  { key: "blink", name: "눈 감기" }, { key: "dist", name: "거리 (멀리↔가까이)" }, { key: "yaw", name: "고개 돌리기" },
];
const demoVals = { jaw: 0.03, brow: 0.05, smile: 0.05, blink: 0.05, dist: 0.43, yaw: 0.5 };
const PRESET = { [A_NAME]: { jaw: 0.75, brow: 0.85, smile: 0.0, blink: 0.0 }, [B_NAME]: { jaw: 0.03, brow: 0.05, smile: 0.05, blink: 0.05 } };
const DEMO_VW = 4 / 3;   // 데모 '화면' 가로 (높이 1 기준)
const nz = s => (Math.random() - 0.5) * 2 * s;

function synthFrame(p) {
  const P = {}, scale = 0.55 + p.dist * 1.05, th = (p.yaw - 0.5) * Math.PI / 2, k = 0.28 * scale;
  for (const [idx, t] of Object.entries(TEMPLATE)) {
    let [x, y, z] = t; const i = +idx;
    if (i === 14) y += 0.28 * p.jaw; if (i === 17) y += 0.3 * p.jaw; if (i === 152) y += 0.25 * p.jaw;
    if (i === 61 || i === 291) { x *= 1 - 0.15 * p.jaw + 0.25 * p.smile; y += 0.1 * p.jaw - 0.06 * p.smile; }
    if (i === 105 || i === 334) y -= 0.12 * p.brow; if (i === 107 || i === 336) y -= 0.1 * p.brow;
    if (i === 159 || i === 386) y += -0.02 * p.brow + 0.09 * p.blink;
    const xr = x * Math.cos(th) + z * Math.sin(th);
    P[i] = [DEMO_VW / 2 + xr * k + nz(0.0008), 0.5 + y * k + nz(0.0008)];
  }
  return { P, bs: [clamp(p.jaw + nz(0.03), 0, 1), clamp(p.brow + nz(0.03), 0, 1)] };
}
function setDemo(expr, jitter = 0, extra = {}) {
  for (const [k, v] of Object.entries(PRESET[expr])) demoVals[k] = clamp(v + nz(jitter), 0, 1);
  Object.assign(demoVals, extra);
}

// =====================================================================
// 게임
// =====================================================================
const S = { INTRO: 1, DESIGN: 2, READY: 3, CAPTURE: 4, TRAIN: 5, TEST_INTRO: 6, TEST_READY: 7, TEST_RUN: 8, RESULT: 9, COMPARE: 10, FINAL: 11 };
const rankOf = xp => { let n = RANKS[0][1]; for (const [need, nm] of RANKS) if (xp >= need) n = nm; return n; };

class Game {
  constructor(info, now) {
    Object.assign(this, info);
    this.logs = []; this.reset(now);
  }
  reset(now) {
    this.xp = 0; this.badges = [];
    this.design = { f: [null, null], ruler: 0 }; this.slot = 0; this.pick = null; this.frozen = null;
    this.samples = []; this.tests = TESTS.map(() => null); this.testIdx = 0;
    this.res = null; this.prevRes = null; this.redesigns = 0; this.firstPass = null; this.liveMax = [1e-6, 1e-6];
    this.setState(S.INTRO, now);
  }
  setState(s, now) {
    this.state = s; this.tState = now;
    if (s === S.FINAL)
      sendToSheet({ kind: "score", game: GAME_ID, room: this.room || "", nickname: this.nickname || this.player,
        player: this.player, student_id: this.studentId || "", name: this.studentName || "",
        condition: this.condition, stage: "완료", xp: this.xp });
  }
  get step() {
    const s = this.state;
    if (s <= S.DESIGN) return 0; if (s <= S.CAPTURE) return 1; if (s === S.TRAIN) return 2;
    if (s <= S.RESULT) return 3; return 4;
  }
  canContinue(now) { return now - this.tState > 0.5; }
  designReady() { const [a, b] = this.design.f; return a && b && !(a.a === b.a && a.b === b.b) && !(a.a === b.b && a.b === b.a); }
  designText() {
    return this.design.f.map((fd, k) => fd ? `F${k + 1}=${KPN[fd.a]}↔${KPN[fd.b]}` : `F${k + 1}=?`).join(", ") + `, 자=${RULERS[this.design.ruler].name}`;
  }
  // ----- 설계 -----
  clickPoint(i) {
    if (this.state !== S.DESIGN) return;
    if (this.pick === null) { this.pick = i; return; }
    if (this.pick === i) { this.pick = null; return; }
    this.design.f[this.slot] = { a: this.pick, b: i }; this.pick = null; this.liveMax[this.slot] = 1e-6;

    if (!this.designReady()) return;
    this.log("design", { design: this.designText(), f: this.design.f, ruler: RULERS[this.design.ruler].key, redesign: this.redesigns });
    this.frozen = null;
    if (this.res) {   // 다시 설계: 같은 데이터·같은 시험 장면으로 즉시 재학습·재채점
      this.prevRes = this.res; this.redesigns++;
      this.res = evaluate(this.samples, this.tests, f => designVec(f, this.design));
      this.log("rescore", { design: this.designText(), acc: +this.res.acc.toFixed(3), pass: this.res.pass,

  }
  // ----- 데이터 모으기 -----
  startCapture(cls, now) { this.capClass = cls; this.capStart = now; this.capCount = 0; this.setState(S.CAPTURE, now); }
  // ----- 시험 -----
  startTest(now) { this.runStart = now; this.runFrames = []; this.setState(S.TEST_RUN, now); }

  advance(now) {
    switch (this.state) {
      case S.INTRO: this.setState(S.DESIGN, now); break;
      case S.READY: this.startCapture(1, now); break;
      case S.TEST_INTRO: this.testIdx = 0; this.setState(S.TEST_READY, now); break;

  update(dt, now, fr) {

      const t = now - this.capStart - COUNTDOWN;
      if (condition === "demo" && t < 0) setDemo(this.capClass > 0 ? A_NAME : B_NAME, 0, { dist: 0.43, yaw: 0.5 });
      if (t >= 0 && fr) {
        const want = Math.min(SAMPLES, Math.floor(t / (CAPTURE_TIME / SAMPLES)) + 1);
        if (this.capCount < want) {
          this.samples.push({ frame: fr, y: this.capClass }); this.capCount++;
          if (condition === "demo") setDemo(this.capClass > 0 ? A_NAME : B_NAME, 0.12, { dist: 0.43 + nz(0.04), yaw: 0.5 + nz(0.04) });
        }
        if (this.capCount >= SAMPLES) {
          if (this.capClass > 0) this.startCapture(-1, now);
          else {
            const raw = this.samples.map(p => designVec(p.frame, this.design)); this.scale = makeScaler(raw);

    if (s === S.TRAIN) {

        this.log("train", { design: this.designText(), acc: +this.res.acc.toFixed(3), w: this.res.model.w.map(v => +v.toFixed(3)) });
        this.setState(S.TEST_INTRO, now);
      }
    }
    if (s === S.TEST_RUN) {
      const t = now - this.runStart - COUNTDOWN, T = TESTS[this.testIdx];
      if (condition === "demo" && t < 0) setDemo(T.y > 0 ? A_NAME : B_NAME, 0, T.demo);
      if (t >= 0 && fr) {
        const want = Math.min(TEST_FRAMES, Math.floor(t / (TEST_TIME / TEST_FRAMES)) + 1);
        if (this.runFrames.length < want) {
          this.runFrames.push(fr);
          if (condition === "demo") setDemo(T.y > 0 ? A_NAME : B_NAME, 0.06, T.demo);
        }
        if (this.runFrames.length >= TEST_FRAMES) {
          this.tests[this.testIdx] = { frames: this.runFrames };
          if (this.testIdx < TESTS.length - 1) { this.testIdx++; this.setState(S.TEST_READY, now); }
          else {
            this.res = evaluate(this.samples, this.tests, f => designVec(f, this.design));
            this.firstPass = this.res.pass;
            this.log("test", { design: this.designText(), acc: +this.res.acc.toFixed(3), pass: this.res.pass,
              rates: this.res.tests.map(t => t && +t.rate.toFixed(2)) });
            if (condition === "demo") Object.assign(demoVals, { dist: 0.43, yaw: 0.5 });

  }
  redesign(now) { this.setState(S.DESIGN, now); }
  toCompare(now) {

  finish(now) {

    this.xp = Math.round(r.acc * 100) + r.pass * 60 + (r.pass === TESTS.length ? 100 : 0);
    this.badges = [];
    if (r.acc >= 0.9) this.badges.push("특징 설계자");
    if (r.pass === TESTS.length) this.badges.push("튼튼한 특징");
    if (this.redesigns > 0 && r.pass > this.firstPass) this.badges.push("끈기 있는 엔지니어");
    if (r.pass > this.google.pass || (r.pass === this.google.pass && r.acc > this.google.acc)) this.badges.push("구글을 이긴 눈");
    this.log("finish", { design: this.designText(), acc: +r.acc.toFixed(3), pass: r.pass, redesigns: this.redesigns, xp: this.xp, badges: this.badges });
    this.setState(S.FINAL, now);
  }
  log(event, data) {
    const row = { time: new Date().toLocaleString("sv-SE"), student_id: this.studentId || "", name: this.studentName || "",
      condition: this.condition, stage: STEPS[this.step], event, detail: JSON.stringify(data) };
    this.logs.push(row);
    sendToSheet({ kind: "log", game: GAME_ID, row: { ...row, nickname: this.nickname || "", room: this.room || "" } });
  }
}

function toFace(X, Y) {   // 점 좌표 → 얼굴 상자 위치 (거울처럼 좌우 반전)

function drawFace(g, fr) {

function plotBackground(model) {
  const [x1, y1, x2, y2] = PLOT, n = 44;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const u = PMIN + (i + 0.5) / n * (PMAX - PMIN), v = PMIN + (j + 0.5) / n * (PMAX - PMIN), p = model.prob(u, v);
    ctx.fillStyle = p >= 0.5 ? `rgba(230,60,60,${0.05 + 0.16 * (p - 0.5) * 2})` : `rgba(50,110,200,${0.05 + 0.16 * (0.5 - p) * 2})`;
    const px = x1 + i / n * (x2 - x1), py = y2 - (j + 1) / n * (y2 - y1);
    ctx.fillRect(px, py, (x2 - x1) / n + 0.5, (y2 - y1) / n + 0.5);
  }
  const w = model.w, pts = [];
  if (Math.abs(w[1]) > 1e-6) for (const u of [PMIN, PMAX]) { const v = -(w[0] * u + w[2]) / w[1]; if (v >= PMIN && v <= PMAX) pts.push([u, v]); }
  if (Math.abs(w[0]) > 1e-6) for (const v of [PMIN, PMAX]) { const u = -(w[1] * v + w[2]) / w[0]; if (u >= PMIN && u <= PMAX) pts.push([u, v]); }

}

function canvasPoint(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }

window.addEventListener("keydown", e => {

function primary(now) {

function handleClick(p, now) {
  const g = game;
  if ([S.INTRO, S.TEST_INTRO, S.COMPARE, S.FINAL].includes(g.state)) { primary(now); return; }
  if (g.state === S.DESIGN) {   // 얼굴 점 클릭
    let best = null, bd = 16;
    for (const d of dotPos) { const dd = Math.hypot(d.x - p[0], d.y - p[1]); if (dd < bd) { bd = dd; best = d; } }
    if (best) { g.clickPoint(best.i); return; }
  }
  const b = buttons.find(b => p[0] >= b.x1 && p[0] <= b.x2 && p[1] >= b.y1 && p[1] <= b.y2);
  if (!b) { primary(now); return; }
  if (b.id === "startcap" || b.id === "starttest") g.advance(now);
  else if (b.id === "confirm") g.confirmDesign(now);
  else if (b.id === "redesign") g.redesign(now);
  else if (b.id === "finish") g.toCompare(now);
  else if (b.id === "freeze") toggleFreeze();
  else if (b.id.startsWith("clear")) g.clearSlot(+b.id.slice(5));
  else if (b.id.startsWith("slot")) g.selectSlot(+b.id.slice(4));
  else if (b.id.startsWith("ruler")) g.setRuler(+b.id.slice(5));
}
function toggleFreeze() {
  if (game.frozen) { game.frozen = null; return; }

  const [x1, y1, x2, y2] = FACE, w = x2 - x1, h = y2 - y1, oc = document.createElement("canvas");
  oc.width = w; oc.height = h; const o = oc.getContext("2d");
  o.translate(w, 0); o.scale(-1, 1); o.drawImage(video, camCrop.sx, camCrop.sy, camCrop.sw, camCrop.sh, 0, 0, w, h);
  game.frozen = { img: oc, frame: lastFrame };   // 화면 표시용으로만 메모리에 잠깐 보관 (저장·전송 안 함)
}

function readFrame() {
  if (condition === "demo") return (lastFrame = synthFrame(demoVals));
  if (!landmarker || video.readyState < 2) return null;
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    const lm = res.faceLandmarks && res.faceLandmarks[0];
    if (lm) {
      const ar = video.videoWidth / video.videoHeight, P = {};
      for (const k of KP) P[k.i] = [lm[k.i].x * ar, lm[k.i].y];
      const b = {}; if (res.faceBlendshapes && res.faceBlendshapes[0]) for (const c of res.faceBlendshapes[0].categories) b[c.categoryName] = c.score;
      lastFrame = { P, bs: [b.jawOpen || 0, b.browInnerUp || 0] };
    } else lastFrame = null;
  }
  return lastFrame;
}

function loop() {
  const now = performance.now() / 1000;
  const dt = prev === null ? 0 : Math.min(0.1, now - prev); prev = now;
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#f7f9fc"); gr.addColorStop(1, "#e3e9f2");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  if (game) try {
    const fr = readFrame();
    if (mouse.click) { const p = mouse.click; mouse.click = null; handleClick(p, now); }
    game.update(dt, now, fr);
    render(game, now, fr);
  } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}
